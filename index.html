<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="wrapper">
    <header>
        <h1>Memory Game</h1>
        <p>Уважаемый ревьюер! Надеюсь к концу проверки ты сможешь поиграть в мою игру!</p>
        <p>Прошу дать мне немного времени</p>
        <br>
    </header>

    <main>
        <div class="game-container">
            <div class="card" data-card="A">A</div>
            <div class="card" data-card="B">B</div>
            <div class="card" data-card="C">C</div>
            <div class="card" data-card="D">D</div>
            <div class="card" data-card="A">A</div>
            <div class="card" data-card="B">B</div>
            <div class="card" data-card="C">C</div>
            <div class="card" data-card="D">D</div>
            <div class="card" data-card="E">E</div>
            <div class="card" data-card="F">F</div>
            <div class="card" data-card="G">G</div>
            <div class="card" data-card="H">H</div>
            <div class="card" data-card="I">I</div>
            <div class="card" data-card="J">J</div>
            <div class="card" data-card="K">K</div>
            <div class="card" data-card="L">L</div>
        </div>
    </main>
    <script src="game.js"></script>
</body>
</html>
